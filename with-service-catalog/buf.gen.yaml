version: v2
clean: true
inputs:
  - directory: proto
plugins:
  # Message + service descriptors (protobuf-es).
  - local: protoc-gen-es
    out: gen
    opt:
      - target=ts
      - import_extension=.ts
  # Connectum service catalog: runtime serviceCatalog + ConnectumCallMap /
  # ConnectumStreamMap augmentation that types ctx.call / ctx.stream.
  #
  # strategy: all is REQUIRED — the catalog aggregates every service into a
  # single catalog.gen.ts, so buf must invoke the plugin once over all files
  # (the default `directory` strategy would run it per-directory and emit a
  # duplicate catalog.gen.ts, keeping only one directory's services).
  - local: protoc-gen-connectum-catalog
    strategy: all
    out: gen
    opt:
      - target=ts
      - import_extension=.ts
