allowBuilds:
  '@bufbuild/buf': true
  esbuild: true
  # @swc/core compiles the Temporal workflow bundle (@temporalio/worker bundles
  # src/temporal/workflows.ts with swc at worker startup — no separate build).
  '@swc/core': true
  # protobufjs is pulled transitively by @temporalio's gRPC client
  # (@grpc/grpc-js → @grpc/proto-loader → protobufjs). Allow its build so pnpm
  # does not report ERR_PNPM_IGNORED_BUILDS on install.
  protobufjs: true

overrides:
  # drizzle-kit declares the deprecated @esbuild-kit/esm-loader, whose
  # core-utils pins esbuild ~0.18.20 (GHSA-67mh-4wv8-2f99). drizzle-kit never
  # loads it — it loads configs through its bundled tsx on its own esbuild
  # 0.25 — so move it onto the same 0.25 line to drop the vulnerable copy.
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
