# Two topologies from ONE image, selected by the `SERVICES` env and a compose
# profile. Config only — not part of the automated test run (the e2e suite runs
# the monolith in-process with an in-memory bus and a PGlite Postgres; see
# tests/e2e).
#
#   docker compose --profile mono  up                      # all services in one process
#   docker compose --profile split up                      # directory + timeoff + payroll + access split
#   docker compose --profile split --profile saga up       # + Temporal, the onboarding gateway, and the worker
#
# All profiles share the same `nats` broker and `postgres` database. The split
# profile shows the headline: identical handler code, separate processes,
# ctx.call auto-routing across the network and LeaveApproved flowing over NATS to
# the payroll role. The `saga` profile adds the durable onboarding saga — a
# Temporal server + Web UI (http://localhost:8088), the OnboardingService gateway
# (:5005), and the worker that hosts OnboardingWorkflow and drives the role
# services. It pairs with `split` (the worker targets the per-role services).
#
# Persistence (Phase 1): DirectoryService is backed by Drizzle ORM over Postgres.
# Every app role wires DATABASE_URL (postgres.js connects lazily, so the timeoff
# and payroll roles never actually open it; only DirectoryService queries). First
# run — apply migrations and seed the directory:
#
#   docker compose up -d postgres            # start Postgres only
#   DATABASE_URL=postgresql://hris:hris@localhost:5432/hris pnpm db:migrate
#   DATABASE_URL=postgresql://hris:hris@localhost:5432/hris pnpm db:seed
#   docker compose --profile mono up         # monolith on :5000 against Postgres

services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - hris
    profiles: ["mono", "split"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris -d hris"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - hris
    profiles: ["mono", "split"]

  # ── Topology A: monolith — every service in one process (SERVICES unset) ──
  mono:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      # SERVICES unset → monolith (all services local).
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["mono"]

  # ── Topology B: microservices — one role per process (SERVICES per role) ──
  directory:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      - SERVICES=directory.v1.DirectoryService
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["split"]

  timeoff:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NATS_URL=nats://nats:4222
      # buildServer() constructs the directory db client for every role, so
      # DATABASE_URL must be present even though this role never mounts the
      # directory (postgres.js connects lazily — the connection is never opened
      # here; DirectoryService is reached over the network via DIRECTORY_ADDR).
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      - SERVICES=timeoff.v1.TimeOffService
      # TimeOff calls the directory over the network; the resolver maps the
      # directory typeName to this URL.
      - DIRECTORY_ADDR=http://directory:5001
    depends_on:
      nats:
        condition: service_healthy
      directory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["split"]

  payroll:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - NATS_URL=nats://nats:4222
      # buildServer() constructs the directory db client for every role, so
      # DATABASE_URL must be present even though this role never mounts the
      # directory (postgres.js connects lazily — the connection is never opened).
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      - SERVICES=payroll.v1.PayrollService
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["split"]

  # ── ACCESS role — the saga's IT-provisioning leaf (in-memory) ─────────────
  access:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      - SERVICES=access.v1.AccessService
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5004/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["split"]

  # ── ONBOARDING role — the saga gateway (pre-check + start workflow) ───────
  #
  # Reaches the directory over the network for its pre-check (DIRECTORY_ADDR) and
  # builds a lazy @temporalio/client to start OnboardingWorkflow (TEMPORAL_ADDRESS).
  onboarding:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - NATS_URL=nats://nats:4222
      - DATABASE_URL=postgresql://hris:hris@postgres:5432/hris
      - SERVICES=onboarding.v1.OnboardingService
      - DIRECTORY_ADDR=http://directory:5001
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_TASK_QUEUE=hris-onboarding
    depends_on:
      directory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5005/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - hris
    profiles: ["saga"]

  # ── Temporal's own metadata store (SEPARATE from the app Postgres) ─────────
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - hris
    profiles: ["saga"]

  # ── Temporal server (auto-setup creates the `default` namespace) ───────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"
    healthcheck:
      # Wait until the frontend is serving and the default namespace exists.
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "describe", "default"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - hris
    profiles: ["saga"]

  # ── Temporal Web UI — inspect onboarding workflows + their compensations ───
  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "8088:8080"
    networks:
      - hris
    profiles: ["saga"]

  # ── WORKER — hosts OnboardingWorkflow + the activities (node src/worker.ts) ─
  #
  # A separate process type (NOT a SERVICES-selected RPC role): no inbound RPC;
  # it polls Temporal for workflow/activity tasks and drives the role services
  # over ConnectRPC. The ONLY process that loads the @temporalio/worker native
  # addon. Pairs with the `split` profile (it targets the per-role services):
  #
  #   docker compose --profile split --profile saga up
  worker:
    build: .
    command: ["node", "src/worker.ts"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=hris-onboarding
      - DIRECTORY_ADDR=http://directory:5001
      - PAYROLL_ADDR=http://payroll:5003
      - TIMEOFF_ADDR=http://timeoff:5002
      - ACCESS_ADDR=http://access:5004
    depends_on:
      temporal:
        condition: service_healthy
      directory:
        condition: service_healthy
      payroll:
        condition: service_healthy
      timeoff:
        condition: service_healthy
      access:
        condition: service_healthy
    networks:
      - hris
    profiles: ["saga"]

networks:
  hris:
    driver: bridge

volumes:
  pgdata:
  temporal-pgdata:
