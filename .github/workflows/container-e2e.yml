name: Container E2E

# Builds the quickstart image and runs the full scenario against it over the wire:
# HEALTHCHECK, /healthz, gRPC reflection, a real unary RPC, gRPC health, and SIGTERM as
# PID 1. Nothing else in either repository covers the container -- the existing e2e tests
# keep client and server in one process, so the production dependency closure (with
# devDependencies stripped), the healthcheck and signal handling are all untested there.
#
# `connectum init` clones getting-started as its base and passes every file through
# except `pnpm-workspace.yaml` and `.pnpmfile.cjs`, so these Dockerfiles are also what a
# scaffolded project gets -- testing them here tests what the CLI hands to users.
#
# The second job builds every other example image from its committed lockfile. The
# images install with `pnpm install --frozen-lockfile`, which fails the moment the
# lockfile, package.json, pnpm-workspace.yaml and the pinned pnpm disagree -- a mismatch
# that no host-side check sees, because only the image build runs the install inside a
# bare build context. hris and car-sharing additionally get their probe asserted: they
# serve plaintext h2c, where `wget` exits 0 for any URL and would report a dead service
# as healthy. Most of these images need a broker or a database to do anything useful,
# so the job builds and inspects them and does not start any of them.
#
# NOT covered, named rather than silently dropped: the tsx execution model (tsx is a
# devDependency and there is no tsx Dockerfile), starting the non-quickstart images (the
# `with-events-*` probes are plain `curl -f`, correct for their HTTP/1.1 default), and
# any broker-backed flow.

on:
  pull_request:
    paths:
      - "getting-started/**"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - "scripts/container-e2e.sh"
      - ".github/workflows/container-e2e.yml"
  push:
    branches: [main]
    paths:
      - "getting-started/**"
      - "**/Dockerfile"
      - "**/.dockerignore"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - "scripts/container-e2e.sh"
  schedule:
    # getting-started installs @connectum/* from npm at build time, so a published
    # regression can break it without anything in the repository changing. The other
    # images are pinned by their lockfiles, but their base images and the registry are
    # not.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-e2e:
    name: "e2e ${{ matrix.runtime.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - { name: node, dockerfile: Dockerfile }
          - { name: bun, dockerfile: Dockerfile.bun }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up buf (for `buf curl`)
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true

      - name: Build the image
        working-directory: getting-started
        run: docker build -f ${{ matrix.runtime.dockerfile }} -t quickstart:${{ matrix.runtime.name }} .

      - name: Run the wire-level scenario
        run: ./scripts/container-e2e.sh quickstart:${{ matrix.runtime.name }} ${{ matrix.runtime.name }}

      - name: Container logs on failure
        if: failure()
        run: docker ps -a --filter "name=e2e-" --format '{{.Names}}' | xargs -r -n1 docker logs --tail 100

  image-build:
    name: "image ${{ matrix.example.dir }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every example with a Dockerfile except getting-started (covered above).
        # `gen`: the Dockerfile copies the gitignored `gen/`, so it is generated on the
        # host first; performance-test-server generates it inside the image instead.
        # `h2c`: the service serves plaintext h2c, so its HEALTHCHECK must speak HTTP/2.
        example:
          - { dir: hris, gen: true, h2c: true }
          - { dir: car-sharing, gen: true, h2c: true }
          - { dir: performance-test-server, gen: false, h2c: false }
          - { dir: o11y-coroot/service, gen: true, h2c: false }
          - { dir: with-events-amqp, gen: true, h2c: false }
          - { dir: with-events-dlq, gen: true, h2c: false }
          - { dir: with-events-kafka, gen: true, h2c: false }
          - { dir: with-events-redpanda, gen: true, h2c: false }
          - { dir: with-events-valkey, gen: true, h2c: false }
    env:
      # The same pnpm the Dockerfiles pin, i.e. the version that writes the committed
      # lockfiles. Kept literal in both places: a mismatch fails the frozen installs.
      PNPM_VERSION: "12.4.1"
      IMAGE: example-image:ci
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.example.gen
        with:
          node-version: "25.2.0"

      - name: Generate the proto code
        if: matrix.example.gen
        working-directory: ${{ matrix.example.dir }}
        # `gen/` is gitignored and the Dockerfile copies it in, so it has to exist before
        # the build. The frozen install also proves the lockfile matches package.json and
        # pnpm-workspace.yaml outside the image. pnpm is installed with npm, exactly as
        # the Dockerfiles do, rather than through a setup action.
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          pnpm run buf:generate

      - name: Build the image
        run: docker build -t "$IMAGE" "${{ matrix.example.dir }}"

      - name: The healthcheck probe must exist in the image
        if: matrix.example.h2c
        # A probe that is not installed fails as "command not found", which Docker reports
        # the same way as a sick service -- so assert the binary rather than infer it.
        run: |
          docker run --rm --entrypoint curl "$IMAGE" --version
          probe=$(docker inspect -f '{{json .Config.Healthcheck.Test}}' "$IMAGE")
          echo "HEALTHCHECK: $probe"
          case "$probe" in
            *"--http2-prior-knowledge"*) echo "h2c-aware probe present" ;;
            *) echo "::error::HEALTHCHECK does not speak HTTP/2; it cannot see an h2c server" >&2; exit 1 ;;
          esac
