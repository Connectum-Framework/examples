name: Proto Lint

# Lints the proto files of every example that ships a `buf:lint` script.
#
# Neither Broker E2E nor Container E2E calls `buf lint`, so a lint failure in an
# example's proto -- or in its `buf.yaml` -- reached main unnoticed: the five
# event examples failed the STANDARD rules on their event-handler services for as
# long as nothing ran the linter. One cell per example with fail-fast off, so one
# failing example does not hide the state of the others.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf-lint:
    name: "buf lint ${{ matrix.example }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example:
          - car-sharing
          - getting-started
          - hris
          - performance-test-server
          - with-custom-interceptor
          - with-events-amqp
          - with-events-dlq
          - with-events-kafka
          - with-events-redpanda
          - with-events-valkey
    env:
      # The pnpm that wrote the committed lockfiles; a mismatch fails the frozen
      # install. Kept literal, as in broker-e2e.yml.
      PNPM_VERSION: "12.4.1"
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.2.0"

      - name: Install
        # The install provides the `buf` binary and, for car-sharing, the auth
        # and events option protos that `buf.yaml` declares as modules. In CI pnpm
        # installs frozen whenever a lockfile is committed; getting-started
        # deliberately has none (it is the scaffold base), so a literal
        # `--frozen-lockfile` would fail there.
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm install

      - name: Lint
        run: pnpm run buf:lint
