name: Broker E2E

# Runs every broker example end to end: its docker compose stack (broker plus the
# two services, built from the example's Dockerfile) and its e2e tests against it.
#
# The image build in container-e2e.yml proves each image builds and that the
# image's own HEALTHCHECK works; it cannot see the compose stack. Two defects
# lived there unnoticed until this job existed: compose healthchecks that called
# a `wget` the image does not have (so `compose up --wait` never succeeded), and
# kafka services that exited on a fresh broker because their topics did not exist.
#
# One cell per example with fail-fast off, so a broken example does not hide the
# state of the others. Container logs are printed on failure: a compose service
# that exits leaves no other trace in the job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-e2e:
    name: "broker e2e ${{ matrix.example }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - with-events-amqp
          - with-events-dlq
          - with-events-kafka
          - with-events-redpanda
          - with-events-valkey
    env:
      # The pnpm the Dockerfiles pin and that wrote the committed lockfiles; a
      # mismatch fails the frozen installs. Kept literal, as in container-e2e.yml.
      PNPM_VERSION: "12.4.1"
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.2.0"

      - name: Install and generate the proto code
        # `gen/` is gitignored and the Dockerfile copies it in, so it has to exist
        # before the images build; the e2e tests use the same install.
        run: |
          npm install -g "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile
          pnpm run buf:generate

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: End-to-end tests
        run: pnpm test

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
