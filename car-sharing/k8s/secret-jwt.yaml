# JWT signing secret consumed by the gateway (trips) role. In production this is
# managed by a secret store (External Secrets, Vault, SOPS) — the literal below
# is a placeholder for the example. Only the trips Deployment mounts it; fleet
# and billing are `public` and never verify JWTs.
apiVersion: v1
kind: Secret
metadata:
  name: trips-jwt
  namespace: car-sharing
  labels:
    app.kubernetes.io/name: trips
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # REPLACE before deploying. The application reads JWT_SECRET (see src/server.ts).
  JWT_SECRET: "replace-me-with-a-strong-random-secret"
