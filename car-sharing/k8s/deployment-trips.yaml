# trips — the EDGE/gateway role. Mounts only TripService and enforces JWT auth +
# proto authz. Reaches fleet and billing via `ctx.call` over the mesh (the
# *_ADDR endpoints in trips-config). This is the only service exposed to
# external clients (through the Istio ingress gateway / VirtualService).
#
# Every trips pod signs its internal calls with the SAME key, mounted from the
# `trips-internal-signing-key` Secret (create it first — see README "Deploy to
# Kubernetes + Istio"). One key for all replicas is what lets fleet verify a
# token from any pod with the single keyset it fetched through the
# load-balanced `trips` Service, and keeps the `kid` stable across restarts and
# rollouts. Without the Secret the pod does not start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trips
  namespace: car-sharing
  labels:
    app.kubernetes.io/name: trips
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: car-sharing
    version: stable
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trips
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trips
        version: stable
    spec:
      serviceAccountName: trips
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Must be >= shutdown.timeout in buildServer() (10s) + SIGTERM buffer.
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: trips
      containers:
        - name: trips
          image: ghcr.io/your-org/car-sharing:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 5000
              protocol: TCP
            # JWKS of the key this pod signs its internal calls with
            # (INTERNAL_JWKS_PORT in trips-config).
            - name: jwks
              containerPort: 9101
              protocol: TCP
          envFrom:
            - configMapRef:
                name: trips-config
          # Phase 4: the gateway is a thin IdP CONSUMER — it holds NO signing
          # secret. Identity is an RS256 JWT minted by an external issuer (Ory
          # Oathkeeper in the Compose demo) and validated here against the
          # issuer's published JWKS. The OATHKEEPER_JWKS_URI / JWT_ISSUER /
          # JWT_AUDIENCE inputs live in trips-config (no Secret). These
          # manifests do not deploy that issuer; see ory/oathkeeper/README.md.
          #
          # The one secret trips does hold is its SERVICE identity: the key it
          # signs internal calls with (INTERNAL_SIGNING_KEY_FILE in trips-config
          # points into this read-only mount).
          volumeMounts:
            - name: internal-signing-key
              mountPath: /var/run/secrets/car-sharing/internal-signing-key
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: grpc
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                # Let endpoints de-register before SIGTERM.
                command: ["sh", "-c", "sleep 5"]
      volumes:
        # trips' service-token private key. Mode 0440 with the pod's fsGroup
        # (1000) makes it readable by the app user only; not optional, so a
        # missing Secret keeps the pod from starting instead of letting it
        # sign with some other key. The mode is written in decimal (288 =
        # octal 0440) because YAML 1.2 tools read a leading-zero literal as
        # decimal 440.
        - name: internal-signing-key
          secret:
            secretName: trips-internal-signing-key
            defaultMode: 288
