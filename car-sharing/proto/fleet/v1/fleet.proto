syntax = "proto3";

package fleet.v1;

import "connectum/auth/v1/options.proto";

// FleetService is the vehicle system of record (a leaf service).
//
// It is an INTERNAL service: never called by external clients, only by other
// services of this app — the trip handler's availability pre-check (a
// cross-service ctx.call to GetVehicle) and the Temporal worker's activities
// (ReserveVehicle / ReleaseVehicle). `service_auth { internal: true }` makes
// every RPC skip end-user (JWT) authentication but require a service token
// instead: the caller signs a short-lived JWT with its own key and sends it in
// `x-internal-token`; the server verifies it against that caller's published
// JWKS (createInternalAuthInterceptor + signedTokenTrust). A request without a
// valid token is UNAUTHENTICATED, whoever sends it.
//
// Which service may call what is least privilege via `requires { roles }` (the
// verified token's `roles` claim, any-of): mutations default to the worker,
// the only service that reserves and releases vehicles; reads are opened per
// method below.
//
// Persistence (Phase 1): the fleet is the only service backed by a real
// database — Drizzle ORM over Postgres (postgres.js). Tests inject a PGlite
// in-process Postgres via the same DI the server uses, so no Docker is needed.
service FleetService {
  option (connectum.auth.v1.service_auth) = {
    internal: true
    default_requires: { roles: ["worker"] }
  };

  // GetVehicle returns a vehicle by id, or NOT_FOUND if unknown. Callable by
  // trips only — the StartTrip availability pre-check; no worker activity
  // reads a single vehicle.
  rpc GetVehicle(GetVehicleRequest) returns (GetVehicleResponse) {
    option (connectum.auth.v1.method_auth) = {
      requires: { roles: ["trips"] }
    };
  }

  // ListVehicles streams vehicles matching a filter, page by page.
  //
  // Server-streaming: the handler is a SQL query (`where`/`order by id`/`limit`)
  // with cursor pagination — the caller re-sends the id of the last streamed
  // vehicle as `page_token` to fetch the next page. With `available_only` the
  // query is narrowed to currently available vehicles.
  //
  // No service calls it today; it is granted to trips alone, the identity that
  // already reads the fleet, rather than left open to any internal caller.
  rpc ListVehicles(ListVehiclesRequest) returns (stream Vehicle) {
    option (connectum.auth.v1.method_auth) = {
      requires: { roles: ["trips"] }
    };
  }

  // ReserveVehicle marks a vehicle reserved (available=false,
  // status="reserved") and returns it. NOT_FOUND if the id is unknown;
  // FAILED_PRECONDITION if the vehicle is already reserved or in maintenance
  // (not currently available). Worker only (the service default).
  rpc ReserveVehicle(ReserveVehicleRequest) returns (Vehicle) {}

  // ReleaseVehicle returns a vehicle to the available pool (available=true,
  // status="available") and returns it. NOT_FOUND if the id is unknown.
  // FAILED_PRECONDITION if the vehicle is in maintenance (cannot be released
  // back into service from the fleet API). Worker only (the service default).
  rpc ReleaseVehicle(ReleaseVehicleRequest) returns (Vehicle) {}
}

message GetVehicleRequest {
  string id = 1;
}

message GetVehicleResponse {
  Vehicle vehicle = 1;
}

message ListVehiclesRequest {
  // When true, only vehicles that are currently available are streamed.
  bool available_only = 1;
  // Max vehicles per page. Server clamps to a sane default/max when 0 or large.
  int32 page_size = 2;
  // Cursor: the id of the last vehicle from the previous page. Empty = first
  // page. The stream itself carries no token, so the client derives the cursor
  // from the last streamed Vehicle.id.
  string page_token = 3;
}

message ReserveVehicleRequest {
  string id = 1;
  // Reservation holder — the trip/workflow id acquiring the lock. Makes reserve
  // idempotent across Temporal retries: the same holder re-reserving its own
  // vehicle succeeds (returns the vehicle), while a held vehicle with a
  // different holder is FAILED_PRECONDITION. Empty for a non-saga caller, which
  // is then treated as having no holder (a held vehicle is always a conflict).
  string holder_id = 2;
}

message ReleaseVehicleRequest {
  string id = 1;
}

// Location is a vehicle's last-known position.
message Location {
  double lat = 1;
  double lng = 2;
}

message Vehicle {
  string id = 1;
  string model = 2;
  // available <=> status == "available". Kept for the trip handler, which only
  // checks availability.
  bool available = 3;
  // Lifecycle state: "available" | "reserved" | "maintenance". Modeled as a
  // string (not a proto enum) so the generated TypeScript stays erasable —
  // this example's tsconfig sets `erasableSyntaxOnly`, which rejects the native
  // `enum` that protoc-gen-es emits. The string domain is pinned in code via a
  // `const` object (see src/db/schema.ts VehicleStatus).
  string status = 4;
  Location location = 5;
}
