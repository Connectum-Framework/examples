# Two stacks from one image, selected by compose profile. Config only — NOT part
# of the automated test run (the e2e suite uses an in-process PGlite Postgres and
# the time-skipping Temporal test server; see tests/).
#
#   docker compose --profile mono up --build    # Phase 1: monolith + Postgres
#   docker compose --profile saga up --build     # Phase 2: durable saga on Temporal
#   docker compose --profile ory  up --build     # Phase 4: Ory (Kratos+Oathkeeper) edge
#
# ── Phase 1 (mono) ──────────────────────────────────────────────────────────
# FleetService over Drizzle + Postgres; every service in-process (SERVICES
# unset). StartTrip needs Temporal, so the `mono` profile is for the fleet /
# persistence demo; the trip saga lives in the `saga` profile.
#
# First run — migrate + seed the fleet:
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://car_sharing:car_sharing@localhost:5432/car_sharing pnpm db:migrate
#   DATABASE_URL=postgresql://car_sharing:car_sharing@localhost:5432/car_sharing pnpm db:seed
#   docker compose --profile mono up app
#
# ── Phase 2 (saga) ──────────────────────────────────────────────────────────
# The three RPC roles split (one process each, role by SERVICES), the Temporal
# WORKER as its own process (`node src/worker.ts`), the Temporal server + Web UI,
# Temporal's OWN Postgres, and the app Postgres (above) for the fleet. Temporal
# owns + migrates its schema (auto-setup), so its store is kept SEPARATE from the
# app db. Run it and watch the saga (and its compensations) in the Web UI:
#
#   docker compose up -d postgres
#   DATABASE_URL=postgresql://car_sharing:car_sharing@localhost:5432/car_sharing pnpm db:migrate
#   DATABASE_URL=postgresql://car_sharing:car_sharing@localhost:5432/car_sharing pnpm db:seed
#   docker compose --profile saga up --build
#   open http://localhost:8088   # Temporal Web UI
#   # Start a trip against the trips role (gRPC :5002, e.g. via grpcurl) and watch
#   # TripWorkflow reserve → record → end → openTab → addCharge → settle. Stop the
#   # billing role mid-run to watch the compensations unwind in reverse.
#
# Service-to-service calls (the trips pre-check, every worker activity) carry a
# per-service signed token: trips and the worker each sign with their own key
# from its own `internal-key-*` volume (written once by `internal-keygen`, so it
# survives restarts) and serve its JWKS on INTERNAL_JWKS_PORT (9101 / 9102,
# network-only, not published to the host); fleet, trips and billing verify against those
# URLs (INTERNAL_ISSUER_*_JWKS). A direct call from the host to an internal
# method, e.g. billing Settle on :5003, is therefore UNAUTHENTICATED.
#
# ── Phase 4 (ory) ───────────────────────────────────────────────────────────
# Ory as the IdP, Connectum as a thin consumer. Kratos owns users/sessions (its
# OWN Postgres — a THIRD independent store next to the app + Temporal dbs);
# Oathkeeper is the edge proxy that validates the Kratos session and MINTS an
# RS256 JWT; the trips gateway validates that JWT against Oathkeeper's published
# JWKS (createRemoteJWKSet). The trips role serves the edge over Connect/HTTP1
# (ALLOW_HTTP1=true) because Oathkeeper's standalone proxy is HTTP, not gRPC. The
# RS256 signing keyset is GENERATED at up-time into a shared volume (no private
# key in git). Config only — NOT part of the automated test run (the e2e simulates
# the mutator with an in-process JWKS server from @connectum/auth/testing). See
# ory/oathkeeper/README.md for the flow. The k8s/istio manifests do not deploy
# Oathkeeper or configure ext_authz.
#
#   docker compose --profile ory up --build
#   open http://localhost:4458            # Kratos self-service UI — register/login
#   # The browser gets an ory_kratos_session cookie, then calls the trips edge via
#   # Oathkeeper (:4455) with that cookie; Oathkeeper mints the JWT and forwards.
#   # Edge is Connect/HTTP1, so demo with curl (NOT grpcurl):
#   #   curl -i http://localhost:4455/trips.v1.TripService/GetTrip \
#   #     -H 'Content-Type: application/json' -b 'ory_kratos_session=...' \
#   #     -d '{"tripId":"trip-demo"}'

services:
  # ── App Postgres for the fleet (shared by both profiles) ───────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: car_sharing
      POSTGRES_PASSWORD: car_sharing
      POSTGRES_DB: car_sharing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_sharing -d car_sharing"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - car-sharing
    profiles: ["mono", "saga", "ory"]

  # ── Phase 1: monolith — every service in-process (SERVICES unset) ──────────
  app:
    build: .
    image: car-sharing:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Monolith: SERVICES unset → every service mounted in-process.
      DATABASE_URL: postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      # Service-to-service auth. The monolith hosts TripService, so it signs
      # its in-process pre-check (ctx.call → FleetService/GetVehicle) as
      # `trips` and serves that key's JWKS on INTERNAL_JWKS_PORT; its own fleet
      # verifies the token against that same endpoint over loopback. There is
      # no worker in this profile, so the worker issuer is not trusted.
      # No INTERNAL_SIGNING_KEY_FILE here on purpose: the only verifier of the
      # trips key is this same process, so a restart replaces the key AND the
      # verifier's cached keyset together — an ephemeral key cannot go stale.
      # (Signers verified by OTHER processes — saga, ory — use the keygen file.)
      INTERNAL_JWKS_PORT: "9101"
      INTERNAL_ISSUER_TRIPS_JWKS: http://localhost:9101/.well-known/jwks.json
      INTERNAL_ISSUER_WORKER_JWKS: ""
    ports:
      - "5000:5000"
    networks:
      - car-sharing
    profiles: ["mono"]

  # ── Temporal's own metadata store (SEPARATE from the app Postgres) ─────────
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── Temporal server (auto-setup creates the `default` namespace) ───────────
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"
    healthcheck:
      # Wait until the frontend is serving and the default namespace exists.
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "describe", "default"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── Temporal Web UI — inspect workflows + their compensations ──────────────
  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    ports:
      - "8088:8080"
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── NATS (JetStream) — the broadcast broker for Phase 3 ────────────────────
  #
  # The trip saga publishes ONE `trips.completed` event on settle; the three
  # reactor processes (below) each subscribe with a DISTINCT consumer group, so
  # each gets its OWN durable consumer = fan-out (a shared group would load-
  # balance / steal). JetStream (`-js`) is REQUIRED because the NATS adapter uses
  # durable consumers. `-m 8222` exposes the monitoring endpoint for the probe.
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── Service-token keys — one RS256 key per signing identity ────────────────
  #
  # One-shot: writes trips.pem and worker.pem (PKCS#8), each into ITS OWN volume,
  # only if absent — so the keys, and the `kid` every verifier caches, survive
  # restarts and `up` re-runs. No private key is committed to git; it is
  # materialized at up-time (the same pattern as oathkeeper-keygen below).
  # One volume per identity, because each signer may read only its own key:
  # a trips container that could read the worker's key could forge the worker.
  # Runs as root only to take ownership of the fresh volumes, then hands the
  # files to the `node` user the app runs as: directory 0700, key 0400. Each
  # signer mounts its own volume read-only.
  internal-keygen:
    build: .
    image: car-sharing:local
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        node src/internalKeygen.ts /keys/trips trips &&
        node src/internalKeygen.ts /keys/worker worker &&
        chown -R node:node /keys/trips /keys/worker &&
        chmod 700 /keys/trips /keys/worker
    volumes:
      - internal-key-trips:/keys/trips
      - internal-key-worker:/keys/worker
    # A one-shot that serves nothing — the image's HTTP /healthz probe does
    # not apply.
    healthcheck:
      disable: true
    networks:
      - car-sharing
    profiles: ["saga", "ory"]

  # ── FLEET role — the persistent leaf (Drizzle + app Postgres) ──────────────
  fleet:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - SERVICES=fleet.v1.FleetService
      - DATABASE_URL=postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      # Every fleet RPC is `internal`: fleet verifies the caller's service token
      # against the JWKS of the issuer the token names. Its callers are trips
      # (the StartTrip pre-check) and the worker (reserve/release). fleet calls
      # no one, so it holds no key of its own.
      - INTERNAL_ISSUER_TRIPS_JWKS=http://trips:9101/.well-known/jwks.json
      - INTERNAL_ISSUER_WORKER_JWKS=http://worker:9102/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5001/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── TRIPS role — the edge/gateway; starts TripWorkflow on Temporal ─────────
  trips:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - SERVICES=trips.v1.TripService
      # buildServer() builds the fleet db client for every role (postgres.js
      # connects lazily, so this role never opens it — fleet is reached over the
      # network); DATABASE_URL must still be present.
      - DATABASE_URL=postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      # The pre-check ctx.call to GetVehicle routes here:
      - FLEET_ADDR=http://fleet:5001
      # StartTrip starts the durable workflow here:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=car-sharing-trips
      # trips signs its pre-check to fleet as `trips` with the key from the
      # keygen volume and publishes the public half here (fleet fetches it from
      # http://trips:9101/.well-known/jwks.json). It verifies the worker's
      # token on RecordTrip / EndTrip.
      - INTERNAL_SIGNING_KEY_FILE=/keys/trips.pem
      - INTERNAL_JWKS_PORT=9101
      - INTERNAL_ISSUER_TRIPS_JWKS=http://trips:9101/.well-known/jwks.json
      - INTERNAL_ISSUER_WORKER_JWKS=http://worker:9102/.well-known/jwks.json
    volumes:
      - internal-key-trips:/keys:ro
    depends_on:
      internal-keygen:
        condition: service_completed_successfully
      fleet:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5002/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── BILLING role — the in-memory billing leaf ─────────────────────────────
  billing:
    build: .
    command: ["node", "src/index.ts"]
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - SERVICES=billing.v1.BillingService
      - DATABASE_URL=postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      # Every billing RPC is `internal` and worker-only; billing verifies the
      # caller's service token (a valid trips token is PERMISSION_DENIED).
      - INTERNAL_ISSUER_TRIPS_JWKS=http://trips:9101/.well-known/jwks.json
      - INTERNAL_ISSUER_WORKER_JWKS=http://worker:9102/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5003/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── WORKER — hosts TripWorkflow + the activities (node src/worker.ts) ──────
  #
  # A separate process type (NOT a SERVICES-selected RPC role): no inbound RPC;
  # it polls Temporal for workflow/activity tasks and drives the role services
  # over ConnectRPC. The ONLY process that loads the @temporalio/worker native
  # addon.
  worker:
    build: .
    command: ["node", "src/worker.ts"]
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=car-sharing-trips
      - FLEET_ADDR=http://fleet:5001
      - TRIPS_ADDR=http://trips:5002
      - BILLING_ADDR=http://billing:5003
      # The worker hosts the publish-only EventBus: on settle it broadcasts ONE
      # `trips.completed` event here (the reactors below consume it).
      - NATS_URL=nats://nats:4222
      # Every activity call is `internal`: the worker signs it as `worker` with
      # the key from the keygen volume and publishes the public half here
      # (fleet, trips and billing fetch it from
      # http://worker:9102/.well-known/jwks.json).
      - INTERNAL_SIGNING_KEY_FILE=/keys/worker.pem
      - INTERNAL_JWKS_PORT=9102
    volumes:
      - internal-key-worker:/keys:ro
    depends_on:
      internal-keygen:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      fleet:
        condition: service_healthy
      trips:
        condition: service_healthy
      billing:
        condition: service_healthy
      nats:
        condition: service_healthy
    # The image's HEALTHCHECK probes an HTTP /healthz this process does not
    # serve (it polls Temporal, it runs no RPC server), so it would always
    # report unhealthy and fail `docker compose up --wait`.
    healthcheck:
      disable: true
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── REACTORS — three INDEPENDENT broadcast subscribers (node src/reactor.ts) ─
  #
  # Each is the SAME image with a different `REACTOR` selector, on its OWN
  # consumer group (cs-pricing / cs-audit / cs-notify), so NATS gives each its
  # own durable consumer and every reactor receives every `trips.completed` =
  # fan-out. Co-hosting all three buses in one process would change the process
  # count, NOT the fan-out semantics (still three durable consumers).
  #
  # A reactor only consumes from NATS and serves no HTTP /healthz, so the
  # image's HEALTHCHECK is disabled; otherwise it would always report unhealthy.
  reactor-pricing:
    build: .
    command: ["node", "src/reactor.ts"]
    environment:
      - REACTOR=pricing
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - car-sharing
    profiles: ["saga"]

  reactor-audit:
    build: .
    command: ["node", "src/reactor.ts"]
    environment:
      - REACTOR=audit
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - car-sharing
    profiles: ["saga"]

  reactor-notify:
    build: .
    command: ["node", "src/reactor.ts"]
    environment:
      - REACTOR=notify
      - NATS_URL=nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - car-sharing
    profiles: ["saga"]

  # ── Phase 4: Ory edge (Kratos + Oathkeeper) ───────────────────────────────
  #
  # Kratos's OWN Postgres — a THIRD store, separate from the app `postgres` and
  # `temporal-postgres`.
  kratos-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: kratos
      POSTGRES_DB: kratos
    volumes:
      - kratos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos -d kratos"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - car-sharing
    profiles: ["ory"]

  # Apply Kratos SQL migrations once, then exit.
  kratos-migrate:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-postgres:
        condition: service_healthy
    volumes:
      - ./ory/kratos:/etc/config/kratos
    command: ["migrate", "sql", "-e", "--yes", "--config", "/etc/config/kratos/kratos.yml"]
    restart: on-failure
    networks:
      - car-sharing
    profiles: ["ory"]

  # Kratos — the identity provider (public :4433, admin :4434).
  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433"
      - "4434:4434"
    volumes:
      - ./ory/kratos:/etc/config/kratos
    # --dev relaxes the prod guards (https base_urls, mandatory secrets) for the
    # demo; the kratos.yml secrets are DEV placeholders. Remove --dev + harden
    # secrets/TLS for any real use.
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4433/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["ory"]

  # Self-service UI so a browser can register/login and obtain the
  # ory_kratos_session cookie used at the edge.
  kratos-selfservice-ui:
    image: oryd/kratos-selfservice-ui-node:v26.2.0
    depends_on:
      kratos:
        condition: service_healthy
    environment:
      - KRATOS_PUBLIC_URL=http://kratos:4433/
      - KRATOS_BROWSER_URL=http://localhost:4433/
      - COOKIE_SECRET=PLEASE-CHANGE-ME-ui-cookie-secret
      - CSRF_COOKIE_NAME=ory_csrf_ui
      - CSRF_COOKIE_SECRET=PLEASE-CHANGE-ME-ui-csrf-secret
      - PORT=4458
    ports:
      - "4458:4458"
    networks:
      - car-sharing
    profiles: ["ory"]

  # One-shot: generate Oathkeeper's RS256 id_token signing keyset into a SHARED
  # volume. No private key is committed to git — it is materialized at up-time.
  oathkeeper-keygen:
    image: oryd/oathkeeper:v0.40.9
    # The image runs as the unprivileged `ory` user and has no /etc/keys, so a
    # fresh named volume is created root-owned and `ory` cannot write into it
    # ("Permission denied"). Root writes the keyset (mode 0644); the oathkeeper
    # service then reads it read-only as `ory`.
    user: "0:0"
    volumes:
      - oathkeeper-keys:/etc/keys
    # `credentials generate` prints the JWKS to stdout; redirect into the volume.
    entrypoint: ["sh", "-c"]
    command:
      - "test -f /etc/keys/id_token.jwks.json || oathkeeper credentials generate --alg RS256 > /etc/keys/id_token.jwks.json"
    networks:
      - car-sharing
    profiles: ["ory"]

  # Oathkeeper — the edge proxy (proxy :4455, api :4456 serves the public JWKS).
  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    depends_on:
      kratos:
        condition: service_healthy
      oathkeeper-keygen:
        condition: service_completed_successfully
    ports:
      - "4455:4455"
      - "4456:4456"
    volumes:
      - ./ory/oathkeeper:/etc/config/oathkeeper:ro
      - oathkeeper-keys:/etc/keys:ro
    command: ["serve", "--config", "/etc/config/oathkeeper/config.yml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4456/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["ory"]

  # trips behind Oathkeeper — reached ONLY through oathkeeper:4455. It validates
  # the minted RS256 JWT against Oathkeeper's JWKS (no shared secret) and serves
  # the all-unary edge over Connect/HTTP1.
  trips-ory:
    build: .
    image: car-sharing:local
    command: ["node", "src/index.ts"]
    environment:
      - PORT=5000
      - SERVICES=trips.v1.TripService
      # Fleet is reached over the network; postgres.js connects lazily so this
      # role never opens the app db, but DATABASE_URL must be present.
      - DATABASE_URL=postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      - FLEET_ADDR=http://fleet-ory:5000
      # Temporal is optional for the auth demo (StartTrip's workflow start needs
      # it; GetTrip pre-checks run lazily). Point at a saga-profile Temporal if
      # running both, else StartTrip's start step will error after the auth+pre-check.
      - TEMPORAL_TASK_QUEUE=car-sharing-trips
      # Phase 4 identity inputs — Connectum as a thin consumer (no JWT_SECRET):
      - OATHKEEPER_JWKS_URI=http://oathkeeper:4456/.well-known/jwks.json
      - JWT_ISSUER=http://oathkeeper:4455/
      - JWT_AUDIENCE=car-sharing-trips
      # Serve the edge over Connect/HTTP1 so Oathkeeper's HTTP proxy can front it.
      - ALLOW_HTTP1=true
      # Service-to-service auth: the pre-check to fleet-ory is signed as
      # `trips` with the keygen volume's key; fleet-ory fetches the public key
      # from http://trips-ory:9101. No worker runs in this profile, so the
      # worker issuer is not trusted.
      - INTERNAL_SIGNING_KEY_FILE=/keys/trips.pem
      - INTERNAL_JWKS_PORT=9101
      - INTERNAL_ISSUER_TRIPS_JWKS=http://localhost:9101/.well-known/jwks.json
      - INTERNAL_ISSUER_WORKER_JWKS=
    volumes:
      - internal-key-trips:/keys:ro
    depends_on:
      internal-keygen:
        condition: service_completed_successfully
      oathkeeper:
        condition: service_healthy
      fleet-ory:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["ory"]

  # The fleet leaf for the ory profile (the pre-check ctx.call target). Internal
  # (it accepts only trips-ory's signed service token), keeps the gRPC/h2c
  # default.
  fleet-ory:
    build: .
    image: car-sharing:local
    command: ["node", "src/index.ts"]
    environment:
      - PORT=5000
      - SERVICES=fleet.v1.FleetService
      - DATABASE_URL=postgresql://car_sharing:car_sharing@postgres:5432/car_sharing
      - INTERNAL_ISSUER_TRIPS_JWKS=http://trips-ory:9101/.well-known/jwks.json
      - INTERNAL_ISSUER_WORKER_JWKS=
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--http2-prior-knowledge", "http://localhost:5000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - car-sharing
    profiles: ["ory"]

networks:
  car-sharing:
    driver: bridge

volumes:
  pgdata:
  temporal-pgdata:
  kratos-pgdata:
  oathkeeper-keys:
  internal-key-trips:
  internal-key-worker:
