# Authorization policies — the network layer of the internal trust boundary.
#
# fleet and billing are `internal` in proto: the application already rejects any
# call without a valid per-service signed token (`x-internal-token`, verified
# against the caller's JWKS) and checks the caller's role per RPC. These mesh
# policies are the second, independent layer: they admit fleet/billing traffic
# only from the trips ServiceAccount principal, so a pod that is not trips
# cannot even reach them. trips itself admits ingress only from the Istio
# ingress gateway (external auth — the end-user JWT — is then enforced inside
# the trips process), plus the narrow JWKS rule below.
---
# fleet: only the trips ServiceAccount may call it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: fleet-allow-trips
  namespace: car-sharing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fleet
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/car-sharing/sa/trips"
---
# billing: only the trips ServiceAccount may call it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: billing-allow-trips
  namespace: car-sharing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/car-sharing/sa/trips"
---
# trips: admit traffic from the Istio ingress gateway (the single external
# entry point; the trips process then verifies the end-user JWT), and let fleet
# and billing fetch trips' service-token public key. That second rule is as
# narrow as the fetch itself: only those two ServiceAccounts, only GET, only
# the JWKS path, only the JWKS container port — it opens none of trips' RPCs.
# (`paths`/`methods` match only because the Service declares the port as HTTP.)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: trips-allow-ingress
  namespace: car-sharing
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: trips
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
    - from:
        - source:
            principals:
              - "cluster.local/ns/car-sharing/sa/fleet"
              - "cluster.local/ns/car-sharing/sa/billing"
      to:
        - operation:
            ports: ["9101"]
            methods: ["GET"]
            paths: ["/.well-known/jwks.json"]
