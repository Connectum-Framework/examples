# Mesh-wide mTLS STRICT for the namespace. Every pod-to-pod call (the trips ->
# fleet pre-check `ctx.call`, and fleet's fetch of trips' JWKS) is mutually
# authenticated and encrypted by the sidecars. It sits under the application's
# own check: the internal services still require a per-service signed token,
# and mTLS keeps that token from being read off the wire and replayed within
# its short lifetime. The AuthorizationPolicy narrows reachability further to
# the trips identity.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: car-sharing
spec:
  mtls:
    mode: STRICT
