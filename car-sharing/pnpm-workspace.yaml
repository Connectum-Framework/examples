allowBuilds:
  '@bufbuild/buf': true
  # @swc/core compiles the Temporal workflow bundle (@temporalio/worker bundles
  # workflowsPath via swc at worker startup). Allow its build so the prebuilt
  # native binding is wired up; without this pnpm reports ERR_PNPM_IGNORED_BUILDS.
  '@swc/core': true
  esbuild: true
  # protobufjs is pulled transitively by @connectum/otel's OTLP/gRPC exporters
  # (@grpc/grpc-js → @grpc/proto-loader → protobufjs). Allow its build so the
  # deps-status check buf runs before generate does not fail on an ignored build.
  protobufjs: true

overrides:
  # drizzle-kit declares the deprecated @esbuild-kit/esm-loader, whose
  # core-utils pins esbuild ~0.18.20 (GHSA-67mh-4wv8-2f99). drizzle-kit never
  # loads it — it loads configs through its bundled tsx on its own esbuild
  # 0.25 — so move it onto the same 0.25 line to drop the vulnerable copy.
  '@esbuild-kit/core-utils>esbuild': '^0.25.0'
  '@grpc/grpc-js@>=1.14.0 <1.14.5': '1.14.5'
  'browserslist@<4.28.7': '^4.28.7'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'protobufjs@>=7.0.0 <7.6.5': '7.6.5'
